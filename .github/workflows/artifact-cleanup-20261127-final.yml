name: Sweep existing Actions artifacts once
on:
  push:
    branches: ["ops/artifact-cleanup-20261127-final"]
    paths: [".github/workflows/artifact-cleanup-20261127-final.yml"]
permissions: {}
jobs:
  cleanup:
    if: ${{ github.repository == 'astrapath-dev/AFFiNE' && github.event_name == 'push' && github.event.before == '8a7f1296eac14f317e9b8d6516ed07acc56a7826' && github.run_attempt == 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      actions: write
    steps:
      - name: Check for Python
        id: runtime
        run: |
          if command -v python3 >/dev/null 2>&1; then echo 'available=true' >> "$GITHUB_OUTPUT"; fi
      - if: steps.runtime.outputs.available != 'true'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Sweep and verify existing artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_REPOSITORY: astrapath-dev/AFFiNE
        run: |
          python3 -u - <<'PY'
          import json, os, time, urllib.request, urllib.error
          repository = os.environ["GITHUB_REPOSITORY"]
          assert repository == os.environ["EXPECTED_REPOSITORY"]
          root = "https://api.github.com/repos/" + repository + "/actions/artifacts"
          token = os.environ["GH_TOKEN"]
          deadline = time.monotonic() + 1800
          def call(method, suffix, allow_absent=False):
              for i in range(5):
                  req = urllib.request.Request(root + suffix, method=method, headers={
                      "Authorization": "Bearer " + token, "Accept": "application/vnd.github+json",
                      "User-Agent": "artifact-cleanup", "X-GitHub-Api-Version": "2022-11-28",
                  })
                  try:
                      with urllib.request.urlopen(req, timeout=25) as r:
                          return json.load(r) if method == "GET" else r.status
                  except urllib.error.HTTPError as e:
                      if e.code == 404 and allow_absent: return 404
                      if e.code in (403, 429):
                          wait = int(e.headers.get("Retry-After", "0"))
                          if e.headers.get("X-RateLimit-Remaining") == "0":
                              wait = max(wait, int(e.headers.get("X-RateLimit-Reset", "0")) - int(time.time()) + 1)
                          if not wait and b"rate limit" not in e.read().lower(): raise
                          wait = max(wait, 60 if not wait else 1)
                      elif e.code in (500, 502, 503, 504):
                          wait = 4 * 2 ** i
                      else:
                          raise
                  except (TimeoutError, urllib.error.URLError):
                      wait = 4 * 2 ** i
                  if i == 4 or time.monotonic() + wait > deadline: raise RuntimeError("API retry budget exceeded")
                  print("Retry in", wait, "seconds", flush=True)
                  time.sleep(wait)
          def inventory():
              by_id = {}
              for p in range(1, 17):
                  result = call("GET", "?per_page=100&page=" + str(p))
                  rows = result["artifacts"]
                  by_id.update((int(x["id"]), x) for x in rows)
                  if len(rows) < 100: return by_id
              raise RuntimeError("Listing exceeded bounded sweep")
          cutoff = "2026-11-27T04:10:00Z"
          initial = inventory()
          selected = {aid: x for aid, x in initial.items() if x["created_at"] <= cutoff}
          print("CLEANUP_START", json.dumps({"count":len(selected),"bytes":sum(x["size_in_bytes"] for x in selected.values())}), flush=True)
          deleted, missing, failures = {}, [], []
          for aid, x in sorted(selected.items(), key=lambda pair: -pair[1]["size_in_bytes"]):
              if time.monotonic() > deadline: break
              try:
                  code = call("DELETE", "/" + str(aid), allow_absent=True)
                  if code == 204:
                      deleted[aid] = x["size_in_bytes"]
                      print("ARTIFACT_DELETED", json.dumps({"id":aid,"bytes":deleted[aid]}), flush=True)
                  elif code == 404: missing.append(aid)
                  else: failures.append([aid,code])
              except urllib.error.HTTPError as e:
                  failures.append([aid,e.code])
                  if e.code in (401,403): break
              except RuntimeError:
                  failures.append([aid,"retry-budget"])
                  break
              time.sleep(1.05)
          after = inventory()
          remaining = sorted(aid for aid,x in after.items() if x["created_at"] <= cutoff)
          print("CLEANUP_RESULT", json.dumps({
              "repo":repository,"deleted_count":len(deleted),"deleted_bytes":sum(deleted.values()),
              "already_absent_count":len(missing),"remaining_count":len(remaining),
              "remaining_bytes":sum(after[i]["size_in_bytes"] for i in remaining),
              "new_count":len(after)-len(remaining),"failures":failures,
          }), flush=True)
          if remaining: raise SystemExit(2)
          PY
